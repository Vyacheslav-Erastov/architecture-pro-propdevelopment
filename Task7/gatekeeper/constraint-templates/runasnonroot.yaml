apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sproprequirenonroot
spec:
  crd:
    spec:
      names:
        kind: K8sPropRequireNonRoot
      validation:
        openAPIV3Schema:
          type: object
          properties:
            message:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sproprequirenonroot

        violation[{"msg": msg, "details": {}}] {
          container := input.review.object.spec.containers[_]
          container.securityContext.runAsUser == 0
          msg := sprintf("Container must not run as root (UID 0): %v", [container.name])
        }

        violation[{"msg": msg, "details": {}}] {
          pod := input.review.object.spec
          pod.securityContext.runAsUser == 0
          msg := "Pod must not run as root (UID 0)"
        }

        violation[{"msg": msg, "details": {}}] {
          container := input.review.object.spec.containers[_]
          not container.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("Container must have readOnlyRootFilesystem: true: %v", [container.name])
        }