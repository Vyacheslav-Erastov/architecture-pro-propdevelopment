apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sproppreventhostpath
spec:
  crd:
    spec:
      names:
        kind: K8sPropPreventHostPath
      validation:
        openAPIV3Schema:
          type: object
          properties:
            message:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sproppreventhostpath

        violation[{"msg": msg, "details": {}}] {
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          msg := sprintf("HostPath volumes are not allowed: %v", [volume.name])
        }

        violation[{"msg": msg, "details": {}}] {
          container := input.review.object.spec.containers[_]
          container.volumeMounts[_].mountPath == "/"
          msg := sprintf("Mounting root filesystem is not allowed: %v", [container.name])
        }